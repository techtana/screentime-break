# ScreenBreak default settings.
# These are the values a new user starts with. build.ps1 embeds this file in ScreenBreak.exe,
# so edit it here and rebuild to change the defaults. Each user's own choices are saved
# separately in %APPDATA%\ScreenBreak\settings.ini and win over these.
# Every setting must be listed here: the app refuses to start if one is missing.

# Break reminder
WorkMinutes=60
RampMinutes=5
StartOpacityPercent=15
MaxOpacityPercent=90
StartCoveragePercent=30
BreakMinutes=10
BreakNeedsIdle=True

# Away from the PC: the break countdown pauses and screen time isn't counted
AwayMinutes=5
AwayCountsController=True
AwayWhenLocked=True
NotAwayWhileWatching=True

# Popup background
UseCustomBackground=False
BackgroundImage=

# Skipping
BypassEnabled=True

# Daily limit (rolling 24 hours)
DailyLimitEnabled=True
DailyLimitHours=4
DailyLimitRepeatMinutes=30

# Bedtime (times are 24-hour HH:mm; corner is TopLeft, TopRight, BottomLeft or BottomRight)
BedtimeEnabled=False
Bedtime=22:30
WakeTime=07:00
BedtimeWarnMinutes=120
BedtimeCorner=BottomRight
BedtimeSnoozeMinutes=15

# General. On first run the app asks about this anyway.
StartWithWindows=False
